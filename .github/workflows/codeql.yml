name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "26 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: manual
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Build
        run: cargo build --locked
      - uses: github/codeql-action/analyze@v3
